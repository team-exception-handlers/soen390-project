# US-2.4: Directions between SGW and Loyola (and vice versa)

appId: host.exp.Exponent

---
- runFlow:
    file: _launch-expo-go.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000

- assertVisible: "Where to?"
- assertVisible:
    id: "directions-panel"
- assertVisible:
    id: "direction-go-button"

- tapOn:
    id: "campus-toggle-loyola"
- extendedWaitUntil:
    visible:
      text: "Loyola"
    timeout: 5000
- tapOn:
    id: "direction-from-button"
- tapOn:
    id: "search-input"
- inputText: "RA"
- extendedWaitUntil:
    visible:
      id: "search-results"
    timeout: 5000
- tapOn:
    id: "search-result-RA"
- extendedWaitUntil:
    visible:
      id: "building-info-directions"
    timeout: 5000
- tapOn:
    id: "building-info-directions"

- tapOn:
    id: "campus-toggle-sgw"
- extendedWaitUntil:
    visible:
      text: "SGW"
    timeout: 3000

- tapOn:
    id: "direction-to-button"
- tapOn:
    id: "search-input"
- inputText: "CL"
- extendedWaitUntil:
    visible:
      id: "search-results"
    timeout: 5000
- tapOn:
    id: "search-result-CL"
- extendedWaitUntil:
    visible:
      id: "building-info-directions"
    timeout: 5000
- tapOn:
    id: "building-info-directions"

- extendedWaitUntil:
    visible:
      id: "direction-from-value-RA"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "direction-to-value-CL"
    timeout: 5000

- assertVisible:
    id: "direction-start-button"
- tapOn:
    id: "direction-start-button"

- extendedWaitUntil:
    visible:
      id: "route-steps-popup"
    timeout: 45000

- assertVisible:
    id: "route-steps-popup"

# Open shuttle tab to view shuttle menu
- assertVisible:
    id: "route-mode-shuttle"
- tapOn:
    id: "route-mode-shuttle"

- extendedWaitUntil:
    visible:
      id: "route-steps-popup"
    timeout: 10000

- tapOn:
    id: "route-steps-close-button"

- extendedWaitUntil:
    notVisible:
      id: "route-steps-popup"
    timeout: 10000

# Zoom map to LOY campus so the walking path is visible
- tapOn:
    id: "campus-toggle-loyola"
- extendedWaitUntil:
    visible:
      text: "Loyola"
    timeout: 3000
- tapOn:
    id: "direction-start-button"
- extendedWaitUntil:
    visible:
      id: "route-steps-popup"
    timeout: 10000
