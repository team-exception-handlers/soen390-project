# US-4.4: Manage Indoor Points of Interest and Navigation

appId: host.exp.Exponent

---
- setPermissions:
    permissions:
      location: inuse
- setLocation:
    latitude: 45.497092
    longitude: -73.5788
- runFlow:
    file: _launch-expo-go.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000

- tapOn: TO
- assertVisible:
    id: icon
    index: 10
- tapOn:
    id: icon
    index: 10
- tapOn: H
- assertVisible: Go There
- tapOn: Go There
- assertVisible: "Room #"
- tapOn: "Room #"
- assertVisible: "0023"
- tapOn: "0023"
- tapOn: View Floor Plan
- tapOn:
    point: 42%,52%
- tapOn: Get Directions
- tapOn: Go
- assertVisible:
    id: indoor-directions-close
- tapOn:
    id: indoor-directions-close
- tapOn: "Room #"
- tapOn:
    id: icon
    index: 8
- tapOn:
    id: icon
    index: 8
- tapOn:
    id: icon
    index: 8
- tapOn:
    id: icon
    index: 8
- tapOn:
    id: label
    index: 15
- tapOn:
    id: label
    index: 18
- tapOn:
    id: label
    index: 7
- assertVisible: H-801
- tapOn: H-801
- tapOn:
    point: 36%,38%
- tapOn:
    point: 32%,38%
- tapOn: Get Directions
- tapOn: Go
- assertVisible:
    id: indoor-directions-close
- tapOn:
    id: indoor-directions-close