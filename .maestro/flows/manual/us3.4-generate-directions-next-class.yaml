# US-3.4: Generate directions to my next class

appId: host.exp.Exponent

---
- runFlow:
    file: _launch-expo-go.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000

- extendedWaitUntil:
    visible:
      id: "tab-calendar"
    timeout: 40000
- tapOn:
    id: "tab-calendar"

- extendedWaitUntil:
    visible:
      text: "Next Class"
    timeout: 30000

- extendedWaitUntil:
    visible:
      text: "Directions"
    timeout: 40000
- tapOn:
    text: "Directions"

- extendedWaitUntil:
    visible:
      id: "route-steps-popup"
    timeout: 45000

- tapOn:
    id: "route-steps-close-button"

- extendedWaitUntil:
    visible:
      id: "route-steps-collapsed-tab"
    timeout: 10000

- assertVisible:
    id: "route-steps-collapsed-tab"
