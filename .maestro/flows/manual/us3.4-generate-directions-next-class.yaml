# US-3.4: Generate directions to my next class

appId: host.exp.Exponent

---
- runFlow:
    file: _launch-expo-go.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000

- extendedWaitUntil:
    visible:
      id: "directions-panel"
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: "direction-from-room-input"
    timeout: 20000
- tapOn:
    id: "direction-from-room-input"
- inputText: "919"
- tapOn:
    point: "50%, 50%"

- extendedWaitUntil:
    visible:
      id: "tab-calendar"
    timeout: 40000
- tapOn:
    id: "tab-calendar"

- extendedWaitUntil:
    visible:
      text: "Next Class"
    timeout: 30000

- extendedWaitUntil:
    visible:
      text: "Directions"
    timeout: 40000
- tapOn:
    text: "Directions"

- extendedWaitUntil:
    visible:
      id: "indoor-directions-button"
    timeout: 20000

- tapOn:
    id: "indoor-directions-button"
