appId: host.exp.Exponent
---
- runFlow:
    file: _launch-expo-go.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000

- extendedWaitUntil:
    visible:
      id: "directions-panel"
    timeout: 20000

# FROM: search "Hall building", confirm, then room 260
- tapOn:
    id: "direction-from-button"

- inputText: "Hall building"

- extendedWaitUntil:
    visible:
      id: "search-result-H"
    timeout: 15000

- tapOn:
    id: "search-result-H"

- extendedWaitUntil:
    visible:
      id: "building-info-directions"
    timeout: 10000

- tapOn:
    id: "building-info-directions"

- tapOn:
    id: "direction-from-room-input"

- inputText: "260"

# TO: search "Hall building", confirm, then room 857
- tapOn:
    id: "direction-to-button"

- inputText: "Hall building"

- extendedWaitUntil:
    visible:
      id: "search-result-H"
    timeout: 15000

- tapOn:
    id: "search-result-H"

- extendedWaitUntil:
    visible:
      id: "building-info-directions"
    timeout: 10000

- tapOn:
    id: "building-info-directions"

- tapOn:
    id: "direction-to-room-input"

- inputText: "857"

- extendedWaitUntil:
    visible:
      id: "indoor-directions-button"
    timeout: 20000

- tapOn:
    id: "indoor-directions-button"

# Switch to Floor 8 for the destination segment
- extendedWaitUntil:
    visible:
      id: "indoor-directions-floor-8"
    timeout: 20000

- tapOn:
    id: "indoor-directions-floor-8"
