# US-4.6: Support Cross-Campus and Cross-Building Navigation

appId: host.exp.Exponent

---
- setPermissions:
    permissions:
      location: inuse
- setLocation:
    latitude: 45.497092
    longitude: -73.5788
- runFlow:
    file: _launch-expo-go.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000
- tapOn: FROM
- tapOn: H
- assertVisible: Start Here
- tapOn: Start Here
- tapOn: Loyola
- assertVisible: CC
- tapOn: CC
- assertVisible: Go There
- tapOn: Go There
- tapOn: "Room #"
- assertVisible: "0023"
- tapOn: "0023"
- tapOn:
    text: "Room #"
    index: 1
- assertVisible: CC-101
- tapOn: CC-101
- tapOn: Go
- tapOn: Exit H Building
- tapOn:
    point: 89%,27%
- assertVisible: Enter CC Building
- tapOn: Enter CC Building
- assertVisible: X
- tapOn:
    point: 89%,27%





