# US-2.4: Support multiple transportation ways (Walk, Car, Public transportation) - Bike, Car Mode (Different Campus)

appId: host.exp.Exponent

---
- runFlow:
    file: _launch-expo-go.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000

- assertVisible: "Where to?"
- assertVisible:
    id: "directions-panel"
- assertVisible:
    id: "direction-go-button"

- tapOn:
    id: "direction-from-button"
- tapOn:
    id: "search-input"
- inputText: "John molson"
- extendedWaitUntil:
    visible:
      id: "search-results"
    timeout: 1000
- tapOn:
    id: "search-result-MB"
- extendedWaitUntil:
    visible:
      id: "building-info-directions"
    timeout: 1000
- tapOn:
    id: "building-info-directions"

- tapOn:
    id: "campus-toggle-loyola"
- extendedWaitUntil:
    visible:
      text: "Loyola"
    timeout: 3000

- tapOn:
    id: "direction-to-button"
- tapOn:
    id: "search-input"
- inputText: "Renaud"
- extendedWaitUntil:
    visible:
      id: "search-results"
    timeout: 1000
- tapOn:
    id: "search-result-SP"
- extendedWaitUntil:
    visible:
      id: "building-info-directions"
    timeout: 1000
- tapOn:
    id: "building-info-directions"

- extendedWaitUntil:
    visible:
      id: "direction-from-value-MB"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "direction-to-value-SP"
    timeout: 5000

- assertVisible:
    id: "direction-start-button"
- tapOn:
    id: "direction-start-button"

- extendedWaitUntil:
    visible:
      id: "route-steps-popup"
    timeout: 45000

- assertVisible:
    id: "route-steps-popup"

# Bike mode (internal walking profile)
- assertVisible:
    id: "route-mode-walking"
- tapOn:
    id: "route-mode-walking"

# Car mode
- assertVisible:
    id: "route-mode-driving"
- tapOn:
    id: "route-mode-driving"

# Public transit mode
- assertVisible:
    id: "route-mode-transit"
- tapOn:
    id: "route-mode-transit"

- extendedWaitUntil:
    visible:
      id: "route-steps-popup"
    timeout: 10000
    id: "route-mode-transit"
- tapOn:
    id: "route-mode-transit"

- extendedWaitUntil:
    visible:
      id: "route-steps-popup"
    timeout: 10000