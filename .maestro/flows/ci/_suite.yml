# CI suite: run all deterministic iOS flows in one Maestro session.

appId: com.anonymous.concordiaclassfinder

---
- runFlow:
    file: us1.1-campus-maps.yml
- runFlow:
    file: us1.5a-building-pop-up-information.yml
- runFlow:
    file: us1.5b-building-pop-up-toggle-campus.yml
- runFlow:
    file: us2.1-select-start-and-destination.yml
- runFlow:
    file: us2.2-current-location-as-start.yml
- runFlow:
    file: us2.4-directions-sgw-loyola.yml
- runFlow:
    file: us2.5a-transport-walking-same-campus.yml
- runFlow:
    file: us2.5b-transport-modes-cross-campus.yml
- runFlow:
    file: us2.6-concordia-shuttle.yml
