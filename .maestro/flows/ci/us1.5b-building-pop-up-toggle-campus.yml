# US-1.5b: Building pop-up and toggle between campuses

appId: com.anonymous.concordiaclassfinder

---
- setPermissions:
    permissions:
      location: inuse

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 25000
- assertVisible:
    id: "campus-toggle-sgw"

- tapOn:
    point: "45%,50%"

- extendedWaitUntil:
    visible:
      id: "building-info-close"
    timeout: 10000
- extendedWaitUntil:
    visible: "Henry F. Hall Building"
    timeout: 3000

- tapOn:
    id: "building-info-close"

- assertNotVisible:
    id: "building-info-drawer"

- tapOn:
    id: "campus-toggle-loyola"
- extendedWaitUntil:
    visible:
      id: "campus-toggle-loyola"
    timeout: 5000

- tapOn:
    id: "campus-toggle-sgw"
- extendedWaitUntil:
    visible:
      id: "campus-toggle-sgw"
    timeout: 5000

- tapOn:
    point: "40%,70%"

- extendedWaitUntil:
    visible:
      id: "building-info-close"
    timeout: 10000
- extendedWaitUntil:
    visible: "Richard J. Renaud Science Complex"
    timeout: 3000

- tapOn:
    id: "building-info-close"

- assertNotVisible:
    id: "building-info-drawer"
