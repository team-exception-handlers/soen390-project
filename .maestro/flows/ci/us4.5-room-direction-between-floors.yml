# US-4.5: Room direction between floors - CI

appId: com.anonymous.concordiaclassfinder

---
- runFlow:
    file: _launch-app.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 25000

- assertVisible: "Where to?"
- assertVisible:
    id: "directions-panel"
- assertVisible:
    id: "direction-go-button"

# FROM: search "Hall building", confirm, then room 260
- runFlow:
    file: _search-from-hall.yml

- tapOn:
    id: "search-room-from-input"
- inputText: "260"

# TO: search "Hall building", confirm, then room 857
- runFlow:
    file: _search-to-hall.yml

- tapOn:
    id: "direction-to-room-input"
- inputText: "857"

- extendedWaitUntil:
    visible:
      id: "indoor-directions-button"
    timeout: 20000
- tapOn:
    id: "indoor-directions-button"

# Switch to Floor 8 for the destination segment
- extendedWaitUntil:
    visible:
      id: "indoor-directions-floor-8"
    timeout: 20000
- tapOn:
    id: "indoor-directions-floor-8"
