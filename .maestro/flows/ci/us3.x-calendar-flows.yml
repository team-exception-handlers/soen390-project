# US-3.1: Google Calendar OAuth + US-3.2 (multi-calendar) + US-3.4 (directions from calendar).

appId: com.anonymous.concordiaclassfinder

---
- runFlow:
    file: _launch-app.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000

- extendedWaitUntil:
    visible:
      id: "tab-calendar"
    timeout: 20000
- tapOn:
    id: "tab-calendar"

- runFlow:
    when:
      visible:
        text: "Sign in with Google"
    commands:
      - tapOn:
          text: "Sign in with Google"

      - extendedWaitUntil:
          visible:
            text: "Continue"
          timeout: 30000
      - tapOn:
          text: "Continue"
      - extendedWaitUntil:
          visible:
            text: "Cancel"
          timeout: 60000
      - runFlow:
          when:
            visible:
              text: "Go Now"
          commands:
            - tapOn:
                text: "Go Now"

      - runFlow:
          when:
            visible:
              text: "Yes"
          commands:
            - tapOn:
                text: "Yes"
      - waitForAnimationToEnd:
          timeout: 45000
      - tapOn:
          point: "50%, 42%"
      - waitForAnimationToEnd:
          timeout: 2000
      - inputText: ${MAESTRO_GOOGLE_E2E_EMAIL}
      - waitForAnimationToEnd:
          timeout: 3500
      - pressKey: enter
      - waitForAnimationToEnd:
          timeout: 20000
      - inputText: ${MAESTRO_GOOGLE_E2E_PASSWORD}
      - waitForAnimationToEnd:
          timeout: 3500
      - pressKey: enter

- extendedWaitUntil:
    visible:
      text: "Upcoming Events"
    timeout: 120000

# --- US-3.2: toggle secondary calendar ---
- extendedWaitUntil:
    visible:
      text: "Primary Calendar"
    timeout: 30000

- tapOn:
    text: "Holidays in Canada"

- extendedWaitUntil:
    visible:
      text: "Holidays in Canada"
    timeout: 30000

- tapOn:
    text: "Primary Calendar"

- extendedWaitUntil:
    visible:
      text: "Primary Calendar"
    timeout: 30000

- assertVisible: "Primary Calendar"

# --- US-3.4: directions from calendar ---
- extendedWaitUntil:
    visible:
      text: "Directions"
    timeout: 30000
- tapOn:
    text: "Directions"

- extendedWaitUntil:
    visible:
      id: "route-steps-popup"
    timeout: 45000
