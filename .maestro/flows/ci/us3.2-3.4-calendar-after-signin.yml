# US-3.2 then US-3.4 in one flow (run after us3.1-google-calendar-connection — Calendar shows “Upcoming Events”).

appId: com.anonymous.concordiaclassfinder

---
# US-3.2: toggle secondary calendar
- extendedWaitUntil:
    visible:
      text: "Primary Calendar"
    timeout: 30000

- tapOn:
    text: "Holidays in Canada"

- extendedWaitUntil:
    visible:
      text: "Holidays in Canada"
    timeout: 30000

- tapOn:
    text: "Primary Calendar"

- extendedWaitUntil:
    visible:
      text: "Primary Calendar"
    timeout: 30000

- assertVisible: "Primary Calendar"

# US-3.4: directions from calendar
- extendedWaitUntil:
    visible:
      text: "Directions"
    timeout: 30000
- tapOn:
    text: "Directions"

- extendedWaitUntil:
    visible:
      id: "route-steps-popup"
    timeout: 45000
