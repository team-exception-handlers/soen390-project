# US-3.1: Connect to Google Calendar (CI — launch app, Calendar tab, OAuth, “Upcoming Events”).

appId: com.anonymous.concordiaclassfinder

---
- runFlow:
    file: _launch-app.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000

- extendedWaitUntil:
    visible:
      id: "tab-calendar"
    timeout: 20000
- tapOn:
    id: "tab-calendar"

- runFlow:
    when:
      visible:
        text: "Sign in with Google"
    commands:
      - tapOn:
          text: "Sign in with Google"

      - extendedWaitUntil:
          visible:
            text: "Continue"
          timeout: 30000
      - tapOn:
          text: "Continue"
      - waitForAnimationToEnd:
          timeout: 35000

      - runFlow:
          when:
            visible:
              text: "Yes"
          commands:
            - tapOn:
                text: "Yes"
            - waitForAnimationToEnd:
                timeout: 5000

      - tapOn:
          point: "50%, 43%"
      - waitForAnimationToEnd:
          timeout: 2000
      - inputText: ${MAESTRO_GOOGLE_E2E_EMAIL}
      - tapOn:
          point: "50%, 25%"
      - tapOn:
          text: "Next"
      - extendedWaitUntil:
          visible:
            text: "Enter your password"
          timeout: 30000
      - tapOn:
          text: "Enter your password"
      - waitForAnimationToEnd:
          timeout: 2000
      - inputText: ${MAESTRO_GOOGLE_E2E_PASSWORD}
      - tapOn:
          point: "50%, 25%"
      - tapOn:
          text: "Next"

- extendedWaitUntil:
    visible:
      text: "Upcoming Events"
    timeout: 120000
