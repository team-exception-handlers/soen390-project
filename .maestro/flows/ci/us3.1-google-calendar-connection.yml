# US-3.1: Connect to Google Calendar (CI — launch app, Calendar tab, OAuth, “Upcoming Events”).

appId: com.anonymous.concordiaclassfinder

---
- runFlow:
    file: _launch-app.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000

- extendedWaitUntil:
    visible:
      id: "tab-calendar"
    timeout: 20000
- tapOn:
    id: "tab-calendar"

- runFlow:
    when:
      visible:
        text: "Sign in with Google"
    commands:
      - tapOn:
          text: "Sign in with Google"

      - extendedWaitUntil:
          visible:
            text: "Continue"
          timeout: 30000
      - tapOn:
          text: "Continue"
      - extendedWaitUntil:
          visible:
            text: "(Email or phone|Yes|.*@.*\\..*)"
          timeout: 30000

      - runFlow:
          when:
            visible:
              text: "Yes"
          commands:
            - tapOn:
                text: "Yes"

      # Scenario 1: fresh sign-in — email field is shown first
      - runFlow:
          when:
            visible:
              text: "Email or phone"
          commands:
            - tapOn:
                text: "Email or phone"
            # Wait for the WebView input to be fully ready before typing
            - waitForAnimationToEnd:
                timeout: 2000
            - inputText: ${MAESTRO_GOOGLE_E2E_EMAIL}
            - tapOn:
                point: "50%, 25%"
            - tapOn:
                text: "Next"
            # Wait for Google to transition to the password page before checking
            - extendedWaitUntil:
                visible:
                  text: "Enter your password"
                timeout: 20000
            - tapOn:
                text: "Enter your password"
            - waitForAnimationToEnd:
                timeout: 2000
            - inputText: ${MAESTRO_GOOGLE_E2E_PASSWORD}
            - tapOn:
                point: "50%, 25%"
            - tapOn:
                text: "Next"

      # Scenario 2: account picker — a saved account email is shown; tap it then enter password
      - runFlow:
          when:
            visible:
              text: ".*@.*\\..*"
          commands:
            - tapOn:
                text: ".*@.*\\..*"
            # Wait for Google to transition to the password page before checking
            - extendedWaitUntil:
                visible:
                  text: "Password"
                timeout: 20000
            - tapOn:
                text: "Password"
            - waitForAnimationToEnd:
                timeout: 2000
            - inputText: ${MAESTRO_GOOGLE_E2E_PASSWORD}
            - tapOn:
                point: "50%, 25%"
            - tapOn:
                text: "Next"

- extendedWaitUntil:
    visible:
      text: "Upcoming Events"
    timeout: 120000
