# US-1.5a: Show additional information for each building (CI – deterministic)

appId: com.anonymous.concordiaclassfinder

---
- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 25000
- assertVisible:
    id: "campus-toggle-sgw"

- tapOn:
    point: "45%,50%"

- extendedWaitUntil:
    visible:
      id: "building-info-close"
    timeout: 10000
- extendedWaitUntil:
    visible: "Henry F. Hall Building"
    timeout: 3000

- tapOn:
    id: "building-info-close"

- assertNotVisible:
    id: "building-info-drawer"
