# US-1.5a: Show additional information for each building (CI – deterministic)

appId: com.anonymous.concordiaclassfinder

---
- setPermissions:
    permissions:
      location: inuse
- setLocation:
    latitude: 45.495376
    longitude: -73.577997
- runFlow:
    file: _launch-app.yaml

- extendedWaitUntil:
    visible:
      id: "header-title"
    timeout: 45000
- assertVisible:
    id: "campus-toggle-sgw"

- extendedWaitUntil:
    visible:
      id: "map-native"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "e2e-select-H"
    timeout: 30000
- tapOn:
    id: "e2e-select-H"

- extendedWaitUntil:
    visible:
      id: "building-info-close"
    timeout: 20000
- extendedWaitUntil:
    visible: "Henry F. Hall Building"
    timeout: 10000

- tapOn:
    id: "building-info-close"

- assertNotVisible:
    id: "building-info-drawer"
