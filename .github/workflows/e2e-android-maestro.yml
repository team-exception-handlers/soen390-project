name: E2E Android (Maestro)

on:
  pull_request:
    branches: [main]
  push:
    branches: ["main"]
  workflow_call:

jobs:
  e2e-android:
    name: Maestro E2E (Android Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Restore prebuilt android folder
        uses: actions/cache@v4
        id: cache-android
        with:
          path: android
          key: android-prebuild-${{ runner.os }}-${{ hashFiles('app.json', 'package.json', 'package-lock.json') }}

      - name: Ensure Android native project
        run: |
          if [ ! -d android ] || [ -z "$(ls -A android 2>/dev/null)" ]; then
            npx expo prebuild -p android --no-install
          fi

      - name: Save prebuilt android folder
        if: steps.cache-android.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android
          key: android-prebuild-${{ runner.os }}-${{ hashFiles('app.json', 'package.json', 'package-lock.json') }}

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          APK_PATH=$(find android -name "*.apk" -path "*debug*" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK not found"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Built APK: $APK_PATH"

      - name: Enable KVM (Linux emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Create Maestro output directory
        run: mkdir -p .maestro/output

      - name: Run Maestro E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          profile: pixel_7_pro
          arch: x86_64
          working-directory: ${{ github.workspace }}
          script: |
            export PATH="$HOME/.maestro/bin:$PATH"
            mkdir -p .maestro/output
            adb install -r -t ${{ env.APK_PATH }}
            maestro test .maestro/flows/ci --format junit --output .maestro/output

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-android-logs
          path: .maestro/
          if-no-files-found: ignore
