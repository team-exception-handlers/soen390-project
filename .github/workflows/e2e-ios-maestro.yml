# E2E tests: build iOS app for Simulator

name: E2E iOS (Maestro)

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

jobs:
  e2e-ios:
    name: Maestro E2E (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm i --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Restore prebuilt ios folder
        uses: actions/cache@v4
        id: cache-ios
        with:
          path: ios
          key: ios-prebuild-${{ runner.os }}-${{ hashFiles('app.json', 'package.json', 'package-lock.json') }}

      - name: Ensure iOS native project
        run: |
          if [ ! -d ios ] || [ -z "$(ls -A ios 2>/dev/null)" ]; then
            npx expo prebuild -p ios --no-install
          fi

      - name: Save prebuilt ios folder
        if: steps.cache-ios.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios
          key: ios-prebuild-${{ runner.os }}-${{ hashFiles('app.json', 'package.json', 'package-lock.json') }}

      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        id: cache-pods
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install CocoaPods
        run: |
          cd ios && pod install && cd ..

      - name: Save CocoaPods cache
        if: steps.cache-pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: Resolve Xcode project and scheme
        id: xcode
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' 2>/dev/null | head -1)
          if [ -n "$WORKSPACE" ]; then
            echo "workspace=$(basename "$WORKSPACE")" >> $GITHUB_OUTPUT
            echo "using=workspace" >> $GITHUB_OUTPUT
          else
            PROJ=$(find . -maxdepth 1 -name '*.xcodeproj' 2>/dev/null | head -1)
            echo "project=$(basename "$PROJ")" >> $GITHUB_OUTPUT
            echo "using=project" >> $GITHUB_OUTPUT
          fi
          SCHEME=$(xcodebuild -list 2>/dev/null | sed -n '1,/Schemes:/d;/^$/q;p' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v -E 'Tests|UITests' | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(xcodebuild -list 2>/dev/null | sed -n '1,/Schemes:/d;/^$/q;p' | head -1 | xargs)
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          cd ..

      - name: Restore DerivedData cache
        uses: actions/cache@v4
        id: cache-dd
        with:
          path: build/ios/DerivedData
          key: ios-dd-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'ios/**/*.xcodeproj/project.pbxproj', 'ios/**/*.xcworkspace/contents.xcworkspacedata') }}

      - name: Build iOS app for Simulator
        run: |
          cd ios
          DD="$GITHUB_WORKSPACE/build/ios/DerivedData"
          mkdir -p "$DD"
          if [ "${{ steps.xcode.outputs.using }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.xcode.outputs.workspace }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -configuration Debug -sdk iphonesimulator \
              -derivedDataPath "$DD" \
              -destination 'generic/platform=iOS Simulator' \
              ONLY_ACTIVE_ARCH=YES build
          else
            xcodebuild -project "${{ steps.xcode.outputs.project }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -configuration Debug -sdk iphonesimulator \
              -derivedDataPath "$DD" \
              -destination 'generic/platform=iOS Simulator' \
              ONLY_ACTIVE_ARCH=YES build
          fi
          cd ..

      - name: Save DerivedData cache
        if: steps.cache-dd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ios/DerivedData
          key: ios-dd-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'ios/**/*.xcodeproj/project.pbxproj', 'ios/**/*.xcworkspace/contents.xcworkspacedata') }}

      - name: Locate built .app
        id: app
        run: |
          DD="$GITHUB_WORKSPACE/build/ios/DerivedData"
          # DerivedData/Build/Products/Debug-iphonesimulator/AppName.app is 5 levels deep
          APP=$(find "$DD" -type d -name "*.app" -path "*Debug*iphonesimulator*" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find "$DD" -type d -name "*.app" 2>/dev/null | head -1)
          fi
          echo "path=$APP" >> $GITHUB_OUTPUT
          echo "Resolved .app: $APP"
          if [ ! -d "$APP" ]; then echo "::error::Built .app not found"; exit 1; fi

      - name: Boot iOS Simulator
        run: |
          xcrun simctl list devices
          # Prefer iPhone 17 on latest OS; fallback to any available iPhone
          LINE=$(xcrun simctl list devices available | grep -E "iPhone 17\s+" | head -1)
          if [ -z "$LINE" ]; then
            LINE=$(xcrun simctl list devices available | grep "iPhone" | head -1)
          fi
          # Extract UDID (last parenthesized UUID on the line)
          DEVICE=$(echo "$LINE" | sed -nE 's/.*\(([0-9A-F-]{36})\).*/\1/p')
          if [ -z "$DEVICE" ]; then
            echo "::error::Could not find an available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          # Wait for simulator to be fully booted before installing app (avoids exit 148)
          echo "Waiting for simulator to boot..."
          for i in $(seq 1 30); do
            if xcrun simctl list devices | grep "$DEVICE" | grep -q Booted; then
              echo "Simulator booted."
              break
            fi
            sleep 2
          done
          if ! xcrun simctl list devices | grep "$DEVICE" | grep -q Booted; then
            echo "::error::Simulator did not reach Booted state"
            xcrun simctl list devices
            exit 1
          fi
          echo "DEVICE_UDID=$DEVICE" >> $GITHUB_ENV

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Debug info
        run: |
          echo "=== Simulators ==="
          xcrun simctl list devices
          echo "=== Resolved .app ==="
          echo "${{ steps.app.outputs.path }}"
          echo "=== Maestro version ==="
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          echo "=== CI flows ==="
          ls -la .maestro/flows/ci/

      - name: Install app on Simulator
        run: |
          xcrun simctl install "$DEVICE_UDID" "${{ steps.app.outputs.path }}"

      - name: Run Maestro CI flows
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --device "$DEVICE_UDID" test .maestro/flows/ci --format junit --output .maestro/output

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-logs
          path: |
            .maestro/output
            .maestro/**/*.log
            .maestro/**/screenshots
          if-no-files-found: ignore
