# E2E tests: build iOS app for Simulator

name: E2E iOS (Maestro)

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ios:
    name: Maestro E2E (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Compute cache keys
        id: cache-keys
        shell: bash
        run: |
          set -euo pipefail

          PREBUILD_HASH=$(shasum app.json package.json package-lock.json | shasum | awk '{print $1}')

          PODS_LIST=$(mktemp)
          if [ -d ios ]; then
            [ -f ios/Podfile ] && echo "ios/Podfile" >> "$PODS_LIST"
            [ -f ios/Podfile.lock ] && echo "ios/Podfile.lock" >> "$PODS_LIST"
          fi
          if [ -s "$PODS_LIST" ]; then
            PODS_HASH=$(
              while IFS= read -r file; do
                shasum "$file"
              done < "$PODS_LIST" | shasum | awk '{print $1}'
            )
          else
            PODS_HASH="no-pods-files"
          fi
          rm -f "$PODS_LIST"

          DD_LIST=$(mktemp)
          if [ -d ios ]; then
            [ -f ios/Podfile.lock ] && echo "ios/Podfile.lock" >> "$DD_LIST"
            find ios -type f \( -path "*/.xcodeproj/project.pbxproj" -o -path "*/.xcworkspace/contents.xcworkspacedata" \) >> "$DD_LIST" || true
            sort -u -o "$DD_LIST" "$DD_LIST"
          fi

          if [ -s "$DD_LIST" ]; then
            DD_HASH=$(
              while IFS= read -r file; do
                if [ -n "$file" ] && [ -f "$file" ]; then
                  shasum "$file"
                fi
              done < "$DD_LIST" | shasum | awk '{print $1}'
            )
          else
            DD_HASH="no-deriveddata-inputs"
          fi
          rm -f "$DD_LIST"

          # Include a hash of JS source so that app code changes invalidate the
          # DerivedData cache and force Xcode to re-bundle the JS with Metro.
          JS_HASH=$(find app components utils -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) 2>/dev/null \
            | sort | xargs shasum 2>/dev/null | shasum | awk '{print $1}')
          [ -z "$JS_HASH" ] && JS_HASH="no-js-sources"
          DD_HASH="${DD_HASH}-js-${JS_HASH}"

          echo "prebuild=$PREBUILD_HASH" >> "$GITHUB_OUTPUT"
          echo "pods=$PODS_HASH" >> "$GITHUB_OUTPUT"
          echo "derived_data=$DD_HASH" >> "$GITHUB_OUTPUT"

      - name: Select iOS Simulator device
        run: |
          # Only resolve the UDID here — booting is deferred until after xcodebuild
          # so that the build doesn't compete with the simulator for the runner's 14 GB RAM.
          LINE=$(xcrun simctl list devices available | grep -E "iPhone 17 Pro\s*\(" | head -1)
          if [ -z "$LINE" ]; then
            LINE=$(xcrun simctl list devices available | grep -E "iPhone 17\s*\(" | head -1)
          fi
          if [ -z "$LINE" ]; then
            LINE=$(xcrun simctl list devices available | grep "iPhone" | head -1)
          fi
          DEVICE=$(echo "$LINE" | sed -nE 's/.*\(([0-9A-F-]{36})\).*/\1/p')
          if [ -z "$DEVICE" ]; then
            echo "::error::No iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator: $DEVICE"
          echo "DEVICE_UDID=$DEVICE" >> $GITHUB_ENV

      - name: Restore prebuilt ios folder
        uses: actions/cache@v4
        id: cache-ios
        with:
          path: ios
          key: ios-prebuild-v2-${{ runner.os }}-${{ steps.cache-keys.outputs.prebuild }}
          restore-keys: |
            ios-prebuild-v2-${{ runner.os }}-

      - name: Ensure iOS native project
        run: |
          if [ "${{ steps.cache-ios.outputs.cache-hit }}" != "true" ]; then
            echo "Prebuild cache miss or partial restore — regenerating native project"
            npx expo prebuild -p ios --clean --no-install --non-interactive
          fi

      - name: Patch Podfile for React-Core umbrella header
        run: |
          if [ -f ios/Podfile ]; then
            if ! grep -q "CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES" ios/Podfile; then
              ruby -e '
                content = File.read("ios/Podfile")
                patch = <<~RUBY
                    installer.pods_project.targets.each do |target|
                      if target.name == "React-Core"
                        target.build_configurations.each do |config|
                          config.build_settings["CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES"] = "YES"
                        end
                      end
                    end
                RUBY
                content.sub!("post_install do |installer|", "post_install do |installer|\n#{patch}")
                File.write("ios/Podfile", content)
              '
            fi
          fi

      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        id: cache-pods
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ steps.cache-keys.outputs.pods }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: cd ios && pod install && cd ..
        # Always run so sandbox stays in sync with Podfile.lock (restored ios/ and Pods can be from different runs).

      - name: Resolve Xcode project and scheme
        id: xcode
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' 2>/dev/null | head -1)
          if [ -n "$WORKSPACE" ]; then
            echo "workspace=$(basename "$WORKSPACE")" >> $GITHUB_OUTPUT
            echo "using=workspace" >> $GITHUB_OUTPUT
          else
            PROJ=$(find . -maxdepth 1 -name '*.xcodeproj' 2>/dev/null | head -1)
            echo "project=$(basename "$PROJ")" >> $GITHUB_OUTPUT
            echo "using=project" >> $GITHUB_OUTPUT
          fi
          SCHEME=$(xcodebuild -list 2>/dev/null | sed -n '1,/Schemes:/d;/^$/q;p' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v -E 'Tests|UITests' | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(xcodebuild -list 2>/dev/null | sed -n '1,/Schemes:/d;/^$/q;p' | head -1 | xargs)
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          cd ..

      - name: Restore DerivedData cache
        uses: actions/cache@v4
        id: cache-dd
        with:
          path: build/ios/DerivedData
          key: ios-dd-${{ runner.os }}-${{ steps.cache-keys.outputs.derived_data }}
          restore-keys: |
            ios-dd-${{ runner.os }}-

      - name: Build iOS app for Simulator
        run: |
          export EXPO_PUBLIC_ENABLE_E2E_HOOKS=1
          DD="$GITHUB_WORKSPACE/build/ios/DerivedData"
          mkdir -p "$(dirname "$DD")"
          rm -rf "$DD"
          mkdir -p "$DD"
          cd ios
          set -o pipefail
          if [ "${{ steps.xcode.outputs.using }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.xcode.outputs.workspace }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -configuration Release -sdk iphonesimulator \
              -derivedDataPath "$DD" \
              -destination 'generic/platform=iOS Simulator' \
              ONLY_ACTIVE_ARCH=YES \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_ENTITLEMENTS="" \
              -parallelizeTargets \
              build 2>&1 | tee "$GITHUB_WORKSPACE/build/xcodebuild.log" | tail -100
          else
            xcodebuild -project "${{ steps.xcode.outputs.project }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -configuration Release -sdk iphonesimulator \
              -derivedDataPath "$DD" \
              -destination 'generic/platform=iOS Simulator' \
              ONLY_ACTIVE_ARCH=YES \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_ENTITLEMENTS="" \
              -parallelizeTargets \
              build 2>&1 | tee "$GITHUB_WORKSPACE/build/xcodebuild.log" | tail -100
          fi
          cd ..

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Locate built .app
        id: app
        run: |
          DD="$GITHUB_WORKSPACE/build/ios/DerivedData"
          EXPECTED_BUNDLE_ID="com.anonymous.concordiaclassfinder"
          # DerivedData/Build/Products/Release-iphonesimulator/AppName.app is 5 levels deep
          APP=$(find "$DD" -type d -name "*.app" -path "*Release*iphonesimulator*" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find "$DD" -type d -name "*.app" 2>/dev/null | head -1)
          fi
          # If multiple apps exist, prefer the one that matches our bundle id.
          while IFS= read -r CANDIDATE; do
            [ -z "$CANDIDATE" ] && continue
            PLIST="$CANDIDATE/Info.plist"
            [ ! -f "$PLIST" ] && continue
            BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" 2>/dev/null || true)
            if [ "$BID" = "$EXPECTED_BUNDLE_ID" ]; then
              APP="$CANDIDATE"
              break
            fi
          done < <(find "$DD" -type d -name "*.app" 2>/dev/null)
          echo "path=$APP" >> $GITHUB_OUTPUT
          echo "Resolved .app: $APP"
          if [ ! -d "$APP" ]; then echo "::error::Built .app not found"; exit 1; fi

      - name: Boot iOS Simulator (after build to avoid memory pressure)
        run: |
          # Boot now that xcodebuild has released memory. The runner has only 14 GB RAM and
          # running the simulator during the build caused silent OOM boot failures.
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true

          # Poll for Booted state — avoid simctl bootstatus which is broken on Xcode 16 /
          # macOS 15 and returns "Restriction Failed on Client API".
          echo "Polling for Booted state..."
          WAITED=0
          MAX_WAIT=120
          while true; do
            STATUS=$(xcrun simctl list devices | grep "$DEVICE_UDID" | grep -oE "(Booted|Shutdown|Booting)" | head -1)
            if [ "$STATUS" = "Booted" ]; then
              break
            fi
            if [ "$WAITED" -ge "$MAX_WAIT" ]; then
              echo "::error::Simulator did not reach Booted state after ${MAX_WAIT}s"
              xcrun simctl list devices
              exit 1
            fi
            sleep 3
            WAITED=$((WAITED + 3))
          done
          echo "Device is Booted. Waiting for SpringBoard (true UI-ready signal)..."

          # SpringBoard running = simulator is fully ready for app install and UI automation.
          WAITED=0
          MAX_WAIT=90
          while true; do
            if xcrun simctl spawn "$DEVICE_UDID" launchctl list 2>/dev/null | grep -q "com.apple.SpringBoard"; then
              echo "SpringBoard is running. Simulator is ready."
              break
            fi
            if [ "$WAITED" -ge "$MAX_WAIT" ]; then
              echo "::warning::SpringBoard check timed out after ${MAX_WAIT}s, proceeding anyway..."
              break
            fi
            sleep 3
            WAITED=$((WAITED + 3))
          done

          # Open the Simulator.app GUI — required on macOS 15 / Xcode 16 for Maestro's XCTest
          # driver to complete its port handshake. Without this the driver times out even though
          # the device process is Booted and SpringBoard is running.
          open -a Simulator

          # Also wait for installd — without this, simctl install hangs indefinitely (no timeout).
          echo "Waiting for installd..."
          WAITED=0
          MAX_WAIT=60
          while true; do
            if xcrun simctl spawn "$DEVICE_UDID" launchctl list 2>/dev/null | grep -q "com.apple.mobile.installd"; then
              echo "installd is ready."
              break
            fi
            if [ "$WAITED" -ge "$MAX_WAIT" ]; then
              echo "::warning::installd not visible after ${MAX_WAIT}s, proceeding anyway..."
              break
            fi
            sleep 3
            WAITED=$((WAITED + 3))
          done

      - name: Install Maestro CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Install app on Simulator
        run: |
          APP_PATH="${{ steps.app.outputs.path }}"
          echo "App size: $(du -sh "$APP_PATH" | cut -f1)"

          install_with_timeout() {
            local udid="$1" app="$2" max_secs="$3"
            xcrun simctl install "$udid" "$app" &
            local pid=$!
            local waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$max_secs" ]; then
                echo "::warning::simctl install hung after ${max_secs}s — killing."
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 1
              fi
              sleep 3
              waited=$((waited + 3))
            done
            wait "$pid"
            return $?
          }

          # First attempt — 3 minute watchdog
          if install_with_timeout "$DEVICE_UDID" "$APP_PATH" 180; then
            echo "App installed successfully."
          else
            # installd was unresponsive; bounce the simulator and retry once
            echo "Bouncing simulator and retrying install..."
            xcrun simctl shutdown "$DEVICE_UDID" 2>/dev/null || true
            sleep 5
            xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
            open -a Simulator

            echo "Waiting for installd after bounce..."
            for _i in $(seq 1 30); do
              xcrun simctl spawn "$DEVICE_UDID" launchctl list 2>/dev/null | grep -q "com.apple.mobile.installd" && break
              sleep 3
            done
            sleep 5

            echo "Retrying install..."
            install_with_timeout "$DEVICE_UDID" "$APP_PATH" 180
          fi

      - name: Require Google E2E secrets
        env:
          GOOGLE_E2E_EMAIL: ${{ secrets.GOOGLE_E2E_EMAIL }}
        run: |
          if [ -z "$GOOGLE_E2E_EMAIL" ]; then
            echo "::error::Set repository secrets GOOGLE_E2E_EMAIL and GOOGLE_E2E_PASSWORD (required — Google Calendar flows run in the default Maestro suite)"
            exit 1
          fi

      - name: Run Maestro CI flows
        env:
          MAESTRO_GOOGLE_E2E_EMAIL: ${{ secrets.GOOGLE_E2E_EMAIL }}
          MAESTRO_GOOGLE_E2E_PASSWORD: ${{ secrets.GOOGLE_E2E_PASSWORD }}
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=600000
          echo "MAESTRO_DRIVER_STARTUP_TIMEOUT=$MAESTRO_DRIVER_STARTUP_TIMEOUT"
          mkdir -p .maestro/output .maestro/debug
          mkdir -p .maestro/recordings
          SUITE_FLOW=".maestro/flows/ci/_suite.yml"
          if [ ! -f "$SUITE_FLOW" ]; then
            echo "::error::Suite flow not found: $SUITE_FLOW"
            exit 1
          fi

          FLOW_BASE="ci-suite"
          VIDEO_FILE=".maestro/recordings/${FLOW_BASE}-ios-simulator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.mp4"
          JUNIT_FILE=".maestro/output/${FLOW_BASE}.xml"
          DEBUG_DIR=".maestro/debug/${FLOW_BASE}"
          LOG_FILE=".maestro/output/${FLOW_BASE}.log"
          mkdir -p "$DEBUG_DIR"

          xcrun simctl io "$DEVICE_UDID" recordVideo --codec=h264 "$VIDEO_FILE" >/tmp/simctl-record-video-${FLOW_BASE}.log 2>&1 &
          REC_PID=$!
          sleep 2
          if ! kill -0 "$REC_PID" 2>/dev/null; then
            echo "::warning::Failed to start simulator recording for suite run. Check /tmp/simctl-record-video-${FLOW_BASE}.log"
          fi

          set +e
          maestro --device "$DEVICE_UDID" test "$SUITE_FLOW" --format junit --output "$JUNIT_FILE" --debug-output "$DEBUG_DIR" >"$LOG_FILE" 2>&1
          FLOW_EXIT=$?
          set -e
          cat "$LOG_FILE"

          if [ $FLOW_EXIT -ne 0 ] && grep -q "iOS driver not ready in time" "$LOG_FILE"; then
            echo "::warning::Driver startup timeout for suite run. Retrying once..."
            # Re-open Simulator.app (may have lost focus) and re-confirm SpringBoard is up
            open -a Simulator
            for _i in $(seq 1 20); do
              xcrun simctl spawn "$DEVICE_UDID" launchctl list 2>/dev/null | grep -q "com.apple.SpringBoard" && break
              sleep 3
            done
            sleep 10
            set +e
            maestro --device "$DEVICE_UDID" test "$SUITE_FLOW" --format junit --output "$JUNIT_FILE" --debug-output "$DEBUG_DIR" >>"$LOG_FILE" 2>&1
            FLOW_EXIT=$?
            set -e
            cat "$LOG_FILE"
          fi

          if kill -0 "$REC_PID" 2>/dev/null; then
            kill -INT "$REC_PID" 2>/dev/null || true
            wait "$REC_PID" 2>/dev/null || true
          fi

          if [ ! -f "$VIDEO_FILE" ]; then
            echo "::warning::Recording file was not created for suite run"
          else
            echo "Recording saved for suite run at $VIDEO_FILE"
          fi

          exit $FLOW_EXIT

      - name: Prepare Maestro artifacts for upload
        if: failure() || success()
        run: |
          mkdir -p maestro-e2e-logs
          cp -r .maestro/output maestro-e2e-logs/ 2>/dev/null || true
          cp -r .maestro/debug maestro-e2e-logs/ 2>/dev/null || true
          cp -r .maestro/recordings maestro-e2e-logs/ 2>/dev/null || true
          cp -r .maestro/flows maestro-e2e-logs/ 2>/dev/null || true
          cp .maestro/config.yaml maestro-e2e-logs/ 2>/dev/null || true
          # Maestro may write screenshots/logs under .maestro (e.g. tests subdir)
          for dir in .maestro/tests .maestro/.maestro; do
            [ -d "$dir" ] && cp -r "$dir" maestro-e2e-logs/ 2>/dev/null || true
          done
          echo "Contents for artifact:"
          find maestro-e2e-logs -type f 2>/dev/null || true

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-logs
          path: maestro-e2e-logs/
          if-no-files-found: ignore
